<title>ASV 2026 참가자 가이드북</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Gothic+A1:wght@400;500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{color-scheme:light}body{margin:0;font-size:14px}
/* Layout: A5 booklet, 16 pages (640×905 design px = 148×210mm, 1px ≈ 0.66pt in print); pages 3–4 are a two-page spread. Pages are paper and stay light in both themes; only the desk follows the theme.
   Type floor for print: body ≥ 13.5px (8.9pt), secondary ≥ 12px (7.9pt), mono labels ≥ 11px (7.2pt).
   Content rule: only what the official site publishes (checked 2026-11-03). No times, no 2025 layout. */
:root{
  --desk:#e3e6ec; --desk-ink:#3c434e;
  --paper:#fcfcfd; --paper-2:#f1f3f6; --ink:#0b0d10; --ink-2:#2f353f; --ink-3:#545c69; --line:#d6dae0; --line-2:#b4bac4;
  --volt:#1436ff; --volt-50:#eef0ff; --volt-100:#dde2ff;
  --sun:#ffc21a; --sun-50:#fff4d1; --sun-ink:#6b4700;
  --leaf:#0c9a68; --leaf-50:#ddf4ea; --leaf-ink:#05553a;
  --coral:#ff4a36; --coral-50:#ffe7e3; --coral-ink:#9c1d0d;
  --f-disp:"Bricolage Grotesque","Gothic A1",system-ui,sans-serif;
  --f-ko:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --t-micro:11px; --t-cap:12px; --t-body:13.5px; --t-item:14.5px; --t-h3:17px; --t-h2:32px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--desk:#14171c;--desk-ink:#a9b0bb;--desk-logo:invert(1);color-scheme:dark}}
:root[data-theme="dark"]{--desk:#14171c;--desk-ink:#a9b0bb;--desk-logo:invert(1);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font-family:var(--f-ko);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;
  padding-block:32px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.desk-head{max-width:1312px;margin:0 auto 24px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;color:var(--desk-ink);font-size:13px}
.desk-head b{font-family:var(--f-disp);font-size:15px;letter-spacing:.02em}
.desk-head .dl{height:28px;width:auto;filter:var(--desk-logo,none)}
.toc{position:sticky;top:0;z-index:5;max-width:1312px;margin:-12px auto 20px;display:flex;gap:6px;overflow-x:auto;padding:10px 0;background:var(--desk);scrollbar-width:none}
.toc::-webkit-scrollbar{display:none}
.toc a{flex:none;font:700 12.5px/1 var(--f-ko);color:var(--desk-ink);text-decoration:none;padding:9px 13px;border-radius:999px;border:1px solid color-mix(in srgb,var(--desk-ink) 32%,transparent)}
.toc a:hover,.toc a:focus-visible{background:var(--desk-ink);color:var(--desk);outline:none}
.sheet{scroll-margin-top:64px}
.book{display:flex;flex-wrap:wrap;justify-content:center;gap:32px;max-width:1312px;margin:0 auto}

/* ---------- sheet ---------- */
.sheet{position:relative;width:640px;height:905px;background:var(--paper);color:var(--ink);overflow:hidden;
  box-shadow:0 1px 2px rgba(11,13,16,.08),0 12px 32px -12px rgba(11,13,16,.28);display:flex;flex-direction:column;padding:42px 44px 46px}
.sheet.spread{width:1280px;padding:34px 44px 42px}
.folio{position:absolute;left:44px;right:44px;bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;font:500 var(--t-micro)/1 var(--f-mono);color:var(--ink-3);letter-spacing:.04em}
.folio .fl{display:inline-flex;align-items:center;gap:9px}
.folio img{height:15px;width:auto;flex:none}
.kicker{font:700 var(--t-micro)/1.2 var(--f-mono);letter-spacing:.14em;color:var(--volt);text-transform:uppercase}
h2{font:900 var(--t-h2)/1.2 var(--f-ko);letter-spacing:-.02em;margin:10px 0 0;text-wrap:balance}
h3{font:800 var(--t-h3)/1.3 var(--f-ko);margin:0;letter-spacing:-.01em}
p{margin:0}
.lede{font-size:var(--t-body);line-height:1.7;color:var(--ink-2);margin-top:12px;max-width:44em}
.mono{font-family:var(--f-mono)}
.code{font:700 var(--t-micro)/1.3 var(--f-mono);color:var(--ink-3);letter-spacing:.02em;white-space:nowrap}
.sec-label{font:700 var(--t-micro)/1.2 var(--f-mono);letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase;margin-bottom:10px}

/* age chips */
.age{display:inline-block;font:700 var(--t-micro)/1.2 var(--f-ko);padding:3px 7px;border-radius:999px;white-space:nowrap;border:1px solid transparent;vertical-align:middle}
.age.all{background:var(--leaf-50);color:var(--leaf-ink)}
.age.e1{background:var(--sun-50);color:var(--sun-ink)}
.age.e4{background:var(--volt-50);color:var(--volt)}
.age.uni{background:var(--paper-2);color:var(--ink-2)}
.age.pre{background:#fff;color:var(--coral-ink);border-color:var(--coral)}
.who{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:var(--t-cap);white-space:nowrap}
.who i{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.who.low i{background:var(--sun)} .who.high i{background:var(--volt)} .who.fam i{background:var(--leaf)}

/* ---------- cover ---------- */
.cover{background:var(--volt);color:#fff;padding:0}
.cover .grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.09) 1px,transparent 1px);background-size:32px 32px}
.cover .in{position:relative;display:flex;flex-direction:column;height:100%;padding:44px 44px 40px}
.cover .top{display:flex;justify-content:space-between;gap:16px;font:700 12px/1.5 var(--f-mono);letter-spacing:.12em}
.cover .by{display:flex;flex-direction:column;align-items:flex-end;gap:9px;font:700 var(--t-micro)/1 var(--f-mono);letter-spacing:.14em;opacity:.95}
.cover .by img{height:44px;width:auto}
.cover .mark{display:flex;flex-direction:column;gap:14px;margin-top:auto;font:800 150px/1 var(--f-disp);letter-spacing:-.045em}
.cover .mark span{display:block;height:.78em;line-height:.78}
.cover .mark .yr{color:var(--sun)}
.cover .title{font:900 30px/1.3 var(--f-ko);letter-spacing:-.02em;margin-top:34px}
.cover .meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 24px;margin:26px 0 0;padding-top:18px;border-top:1.5px solid rgba(255,255,255,.55);font-size:14px;line-height:1.5}
.cover .meta dt{font:700 var(--t-micro)/1 var(--f-mono);letter-spacing:.12em;opacity:.8;margin-bottom:7px}
.cover .meta dd{margin:0;font-weight:800}
.cover .zones{display:flex;gap:8px;margin-top:24px;align-items:center;flex-wrap:wrap}
.cover .zones b{display:grid;place-items:center;width:46px;height:46px;border:1.5px solid #fff;border-radius:50%;font:800 18px/1 var(--f-disp)}
.cover .zones b.r{width:auto;padding:0 16px;border-radius:23px;background:var(--sun);border-color:var(--sun);color:var(--ink)}
.cover .ribbon{margin-left:auto;font:800 13px/1.4 var(--f-ko);text-align:right}

/* ---------- at a glance ---------- */
.facts{display:grid;grid-template-columns:1fr 1fr;margin:22px 0 0;border-top:2px solid var(--ink)}
.facts div{padding:11px 0;border-bottom:1px solid var(--line);min-width:0}
.facts div:nth-child(odd){padding-right:16px}
.facts dt{font:700 var(--t-micro)/1 var(--f-mono);letter-spacing:.1em;color:var(--ink-3);margin-bottom:7px}
.facts dd{margin:0;font-weight:800;font-size:15px;line-height:1.4}
.zone-list{display:flex;flex-direction:column;margin-top:18px}
.zrow{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:14px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.zl{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:800 17px/1 var(--f-disp);background:var(--ink);color:#fff;flex:none;letter-spacing:-.02em}
.zl.sm{font-size:15px}
.zl.r88{background:var(--sun);color:var(--ink)} .zl.sp{background:var(--coral)}
.zrow .zn{font-weight:800;font-size:var(--t-item);line-height:1.3}
.zrow .zn small{display:block;font-weight:500;color:var(--ink-3);font-size:var(--t-cap);margin-top:2px}
.zrow .zc{font:800 26px/1 var(--f-disp);font-variant-numeric:tabular-nums;white-space:nowrap}
.zrow .zc small{font:600 var(--t-cap) var(--f-ko);color:var(--ink-3);margin-left:3px}
.legend{margin-top:auto;padding:15px 18px;background:var(--paper-2);border-radius:6px;display:flex;flex-direction:column;gap:10px}
.legend h3{font-size:14px}
.leg-row{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:var(--t-cap);line-height:1.5;color:var(--ink-2);align-items:center}

/* ---------- board spread: zone columns, grouped by audience ---------- */
.bd-head{display:flex;align-items:flex-end;gap:12px 24px;flex-wrap:wrap}
.bd-head h2{margin-top:6px;font-size:28px}
.bd-head .side{margin-left:auto;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px 8px;font-size:var(--t-cap);color:var(--ink-2);align-items:center}
.bd{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));column-gap:18px;margin-top:14px;border-top:2px solid var(--ink)}
.bd-col{display:flex;flex-direction:column;min-width:0}
.bd-col.span2{grid-column:span 2;display:block;column-count:2;column-gap:18px;column-fill:balance}
.bd-z{break-inside:avoid;break-after:avoid}
.bd-g > .age{break-after:avoid}
.bd-g .it{break-inside:avoid}
.bd-z{display:flex;align-items:center;gap:9px;padding:10px 0 8px;border-bottom:1.5px solid var(--ink)}
.bd-z + .bd-g{margin-top:2px}
.bd-g + .bd-z{margin-top:10px;border-top:2px solid var(--ink)}
.bd-z .zl{width:32px;height:32px;font-size:14px}
.bd-z .zl.sm{font-size:12px}
.bd-z b{font-weight:900;font-size:15px;line-height:1.2}
.bd-z small{margin-left:auto;font:700 var(--t-micro)/1 var(--f-mono);color:var(--ink-3);white-space:nowrap}
.bd-g{padding:6px 0 4px}
.bd-g > .age{margin:2px 0 4px}
.bd-g .it{display:grid;grid-template-columns:30px minmax(0,1fr);gap:0 4px;padding:1.5px 0 1.5px 8px;border-left:3px solid var(--g);font-size:12.5px;font-weight:700;line-height:1.3;color:var(--ink)}
.bd-g .it .code{color:var(--ink-3);padding-top:1px}
.bd-g.all{--g:var(--leaf)} .bd-g.e1{--g:var(--sun)} .bd-g.e4{--g:var(--volt)} .bd-g.pre{--g:var(--coral)} .bd-g.uni{--g:var(--line-2)}
.bd-foot{display:flex;gap:8px 18px;flex-wrap:wrap;align-items:center;margin-top:auto;padding-top:9px;border-top:1px solid var(--line);font-size:var(--t-cap);color:var(--ink-2)}

/* ---------- audience pages ---------- */
.low{--ac:var(--sun);--ac-50:var(--sun-50);--ac-ink:var(--sun-ink)}
.high{--ac:var(--volt);--ac-50:var(--volt-50);--ac-ink:var(--volt)}
.fam{--ac:var(--leaf);--ac-50:var(--leaf-50);--ac-ink:var(--leaf-ink)}
.aud-pill{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:7px 14px 7px 10px;border-radius:999px;background:var(--ac);font:800 14px/1.2 var(--f-ko);white-space:nowrap}
.low .aud-pill{color:var(--ink)} .high .aud-pill,.fam .aud-pill{color:#fff}
.aud-pill i{width:10px;height:10px;border-radius:50%;background:currentColor;opacity:.85}
.aud-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.aud-top .kicker{color:var(--ac-ink)}
.sheet.aud h2{font-size:30px;margin-top:16px}
.basis{margin-top:auto;display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;font-size:var(--t-cap);color:var(--ink-2);line-height:1.5;padding:9px 12px;border-radius:6px;background:var(--paper-2)}
.basis b{font-weight:800;color:var(--ink)}
.cards{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin:18px 0 16px}
.card{border:1.5px solid var(--ink);border-radius:8px;padding:13px 14px 14px;display:flex;flex-direction:column;gap:6px;min-width:0;background:#fff;position:relative}
.card::before{content:"";position:absolute;left:-1.5px;top:-1.5px;bottom:-1.5px;width:6px;border-radius:8px 0 0 8px;background:var(--ac)}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .code{font-size:12px;color:var(--ac-ink)}
.card b{font-weight:900;font-size:15.5px;line-height:1.35;letter-spacing:-.01em}
.card .d{font-size:13px;line-height:1.55;color:var(--ink-2)}
.card .o{margin-top:auto;font-size:var(--t-cap);color:var(--ink-3);line-height:1.4;padding-top:4px;border-top:1px dashed var(--line)}
.pick-list{display:flex;flex-direction:column;border-top:2px solid var(--ink);margin-top:16px}
.pick{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline}
.pick b{font-weight:800;font-size:var(--t-item);line-height:1.35}
.pick .d{grid-column:2/-1;font-size:var(--t-cap);color:var(--ink-2);line-height:1.45}
.pick .age{grid-column:3;grid-row:1}
.tip{margin-top:auto;padding:14px 16px;border-radius:6px;font-size:var(--t-cap);line-height:1.65;color:var(--ink-2);background:var(--ac-50)}
.tip b{color:var(--ink);font-size:13px}
.shows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.show{display:grid;grid-template-columns:34px minmax(0,1fr);gap:1px 6px;padding:8px 10px;border-radius:6px;background:var(--coral-50);min-width:0}
.show .code{color:var(--coral-ink);padding-top:2px}
.show b{font-weight:800;font-size:13.5px;line-height:1.3}
.show span:last-child{grid-column:2;font-size:var(--t-cap);color:var(--ink-2);line-height:1.35}

/* ---------- program index ---------- */
.idx-head{display:flex;align-items:center;gap:14px}
.idx-head .zl{width:48px;height:48px;font-size:20px}
.idx-head .zl.sm{font-size:16px}
.idx-head h2{margin:2px 0 0;font-size:24px}
.idx-head p{font-size:var(--t-cap);color:var(--ink-3);margin-top:3px;line-height:1.4}
.idx{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:22px;border-top:2px solid var(--ink);margin-top:12px}
.row{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:2px 8px;padding:4px 0;border-bottom:1px solid var(--line);align-items:baseline;min-width:0}
.row b{grid-column:2/-1;font-weight:800;font-size:13.5px;line-height:1.35}
.row .org{grid-column:2;grid-row:2;font-size:var(--t-cap);color:var(--ink-3);line-height:1.4;min-width:0}
.row .tags{grid-column:3;grid-row:2;display:flex;gap:4px;align-items:center;justify-self:end;align-self:center}
.row .tags i{width:9px;height:9px;border-radius:50%;display:inline-block}
.row .tags i.low{background:var(--sun)} .row .tags i.high{background:var(--volt)} .row .tags i.fam{background:var(--leaf)}
.sub-zone{margin-top:22px}
.idx.dense .row{padding:3px 0}
.cont{font:700 var(--t-micro)/1 var(--f-mono);color:var(--ink-3);letter-spacing:.08em;margin-top:8px}

/* ---------- food & places ---------- */
.food{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:22px;border-top:2px solid var(--ink);margin-top:10px}
.food div{padding:7px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:38px minmax(0,1fr);gap:1px 8px;align-items:baseline}
.food b{font-weight:800;font-size:13.5px;line-height:1.3}
.food span:last-child{grid-column:2;font-size:var(--t-cap);color:var(--ink-2);line-height:1.4}
.places{margin-top:auto;padding:13px 16px;background:var(--paper-2);border-radius:6px}
.places dl{margin:6px 0 0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:var(--t-cap);line-height:1.45;color:var(--ink-2)}
.places dt{font-weight:800;color:var(--ink);white-space:nowrap}
.places dd{margin:0}

/* ---------- back cover ---------- */
.back{background:var(--ink);color:#fff}
.back .kicker{color:var(--sun)}
.back h2{color:#fff}
.back dl{margin:22px 0 0;display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px 16px;font-size:var(--t-body);line-height:1.55;border-top:1px solid rgba(255,255,255,.3);padding-top:16px}
.back dt{font:700 var(--t-micro)/1.9 var(--f-mono);letter-spacing:.08em;color:rgba(255,255,255,.72)}
.back dd{margin:0;font-weight:600}
.check{margin-top:18px;border:1.5px solid var(--sun);border-radius:6px;padding:12px 16px;font-size:var(--t-cap);line-height:1.6;color:rgba(255,255,255,.88)}
.check b{color:var(--sun);font-size:13px}
.inst{margin-top:18px}
.inst .sec-label{color:rgba(255,255,255,.72)}
.inst p{display:flex;flex-wrap:wrap;gap:6px}
.inst b{font-size:var(--t-cap);font-weight:700;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:4px 10px;line-height:1.3}
.memo{margin-top:18px;border:1.5px dashed rgba(255,255,255,.45);border-radius:6px;padding:14px 16px 30px;font-size:var(--t-cap);color:rgba(255,255,255,.85);line-height:1.6}
.memo b{color:#fff;font-size:13px}
.back .slogan{margin-top:auto;font:900 24px/1.35 var(--f-ko);letter-spacing:-.02em;text-wrap:balance}
.back .slogan small{display:block;font:700 var(--t-micro)/1.4 var(--f-mono);letter-spacing:.12em;color:var(--sun);margin-bottom:8px}
.back .folio{color:rgba(255,255,255,.6)}
.credit{margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.3);display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.credit img{height:58px;width:auto}
.credit p{font-size:var(--t-cap);line-height:1.6;color:rgba(255,255,255,.82)}
.credit p b{display:block;color:#fff;font-size:14px;margin-bottom:2px}

/* ---------- phone ---------- */
@media screen and (max-width:700px){
  body{padding-block:16px 40px}
  .book{gap:20px}
  .sheet{width:100%;height:auto;padding:28px 20px 50px}
  .sheet.spread{width:100%;padding:24px 16px 50px}
  .folio{left:20px;right:20px}
  .sheet.cover{padding:0}
  .cover .in{padding:28px 22px 30px;min-height:640px}
  .cover .top{font-size:11px}
  .cover .mark{font-size:min(30vw,140px);margin-top:44px}
  .cover .meta{grid-template-columns:1fr 1fr}
  h2,.sheet.aud h2{font-size:26px}
  .facts,.idx,.food,.cards,.shows{grid-template-columns:minmax(0,1fr)}
  .facts div:nth-child(odd){padding-right:0}

}

}

  return "";
}
